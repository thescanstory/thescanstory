<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Compile demo.mind</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #111; color: #fff; gap: 16px; }
    #status { font-size: 1.1rem; }
    #bar-wrap { width: 300px; height: 12px; background: #333; border-radius: 8px; overflow: hidden; display: none; }
    #bar { height: 100%; width: 0%; background: #7c3aed; transition: width 0.2s; }
    a { color: #a78bfa; font-size: 1.2rem; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Demo .mind compiler</h2>
  <div id="status">Loading MindAR…</div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="link"></div>

  <script type="module">
    const status = document.getElementById('status');
    const barWrap = document.getElementById('bar-wrap');
    const bar = document.getElementById('bar');
    const linkDiv = document.getElementById('link');

    try {
      status.textContent = 'Loading MindAR compiler…';
      const { Compiler } = await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');

      status.textContent = 'Loading image…';
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = '/demo-target.jpg';
      await img.decode();

      status.textContent = 'Compiling… 0%';
      barWrap.style.display = 'block';

      const compiler = new Compiler();
      await compiler.compileImageTargets([img], (progress) => {
        const pct = Math.round(progress * 100);
        status.textContent = `Compiling… ${pct}%`;
        bar.style.width = pct + '%';
      });

      const exported = await compiler.exportData();
      const blob = new Blob([exported], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);

      status.textContent = '✅ Done! Download the file and tell Kiro.';
      barWrap.style.display = 'none';

      const a = document.createElement('a');
      a.href = url;
      a.download = 'demo-target.mind';
      a.textContent = '⬇ Download demo-target.mind';
      linkDiv.appendChild(a);
    } catch (e) {
      status.textContent = '❌ Error: ' + (e?.message ?? e);
    }
  </script>
</body>
</html>
